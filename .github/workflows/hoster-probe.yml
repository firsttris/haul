# Tries every hoster plugin on real hosters, daily: our own test files, checked, resolved and
# downloaded like Haul does it (`haul probe`, crates/haul/src/probe.rs). The scheduled run opens
# an issue per case that breaks and closes it when the case works again.
#
# The links are secrets (Settings → Secrets and variables → Actions), one per case:
#   PROBE_<NAME>             the link, e.g. PROBE_GOFILE_FOLDER for the case gofile-folder; or the
#                            case as JSON, e.g. with an account. Without any the job does nothing.
#   HAUL_PROBE_ZIP_PASSWORD  optional: the log and the hoster's pages of failed cases, as an
#                            encrypted 7z artifact (they contain the links)
# What to expect of each file (name, size, checksum) is in .github/hoster-probe.json.
# See docs/plugins.md, "Testing on real hosters".
name: Hoster probe

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "plugins/**"
      - "packages/plugin-sdk/**"
      - "crates/haul/src/plugins/**"
      - "crates/haul/src/probe.rs"
      - "scripts/probe-issues.cjs"
      - ".github/hoster-probe.json"
      - ".github/workflows/hoster-probe.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      ZIP_PASSWORD: ${{ secrets.HAUL_PROBE_ZIP_PASSWORD }}
    steps:
      # Only the PROBE_* secrets reach the probe, not the repository's other ones.
      - name: Links
        id: cases
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          jq 'with_entries(select(.key | startswith("PROBE_")))' <<<"$SECRETS" > "$RUNNER_TEMP/probe-links.json"
          if [ "$(jq length "$RUNNER_TEMP/probe-links.json")" = 0 ]; then
            echo "::warning::No PROBE_* secrets (or none available to this run); nothing to probe."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ !steps.cases.outputs.skip }}
      - uses: pnpm/action-setup@v4
        if: ${{ !steps.cases.outputs.skip }}
      - uses: actions/setup-node@v4
        if: ${{ !steps.cases.outputs.skip }}
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !steps.cases.outputs.skip }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !steps.cases.outputs.skip }}
      - name: Build
        if: ${{ !steps.cases.outputs.skip }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:plugins
          cargo build -p haul

      - name: Probe
        id: probe
        if: ${{ !steps.cases.outputs.skip }}
        run: |
          set +e
          ./target/debug/haul probe --secrets "$RUNNER_TEMP/probe-links.json" --out probe-out .github/hoster-probe.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          [ -f probe-out/summary.md ] && cat probe-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Pages of failed cases (encrypted)
        if: ${{ !steps.cases.outputs.skip && env.ZIP_PASSWORD != '' }}
        run: 7z a -p"$ZIP_PASSWORD" -mhe=on probe-pages.7z probe-out > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ !steps.cases.outputs.skip && hashFiles('probe-pages.7z') != '' }}
        with:
          name: probe-pages
          path: probe-pages.7z
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !steps.cases.outputs.skip && hashFiles('probe-out/report.json') != '' }}
        with:
          name: probe-report
          path: probe-out/report.json
          retention-days: 30

      # Issues only from the daily runs: a pull request shows its result in its checks.
      - uses: actions/cache/restore@v4
        if: ${{ !steps.cases.outputs.skip && github.event_name != 'pull_request' }}
        with:
          path: .probe-state
          key: hoster-probe-state-${{ github.run_id }}
          restore-keys: hoster-probe-state-
      - name: Issues
        if: ${{ !steps.cases.outputs.skip && github.event_name != 'pull_request' && hashFiles('probe-out/report.json') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/probe-issues.cjs');
            await run({ github, context, core, report: 'probe-out/report.json', state: '.probe-state/state.json' });
      - uses: actions/cache/save@v4
        if: ${{ !steps.cases.outputs.skip && github.event_name != 'pull_request' && hashFiles('.probe-state/state.json') != '' }}
        with:
          path: .probe-state
          key: hoster-probe-state-${{ github.run_id }}

      - name: Result
        if: ${{ !steps.cases.outputs.skip }}
        run: |
          if [ "${{ steps.probe.outputs.code }}" != "0" ]; then
            echo "::error::A hoster case needs attention, see the summary."
            exit 1
          fi
