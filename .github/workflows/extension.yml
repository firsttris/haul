name: Browser extension

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['extension/**', '.github/workflows/extension.yml']
  # The release workflow builds the extension and attaches the artifact to the GitHub release.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @haul/extension typecheck
      - run: bun run build:extension
      - run: bunx web-ext@8 lint --source-dir extension/dist/firefox --warnings-as-errors
      - name: Pack
        run: |
          mkdir -p out
          (cd extension/dist/chrome && zip -qr ../../../out/haul-extension-chrome.zip .)
          (cd extension/dist/firefox && zip -qr ../../../out/haul-extension-firefox.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: haul-extension
          path: out/*.zip
