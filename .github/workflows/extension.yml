name: Browser extension

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['extension/**', '.github/workflows/extension.yml']
  # The release workflow builds the extension and attaches the artifact to the GitHub release.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @haul/extension typecheck
      - run: pnpm build:extension
      - run: pnpm --filter @haul/extension exec web-ext lint --source-dir dist/firefox --warnings-as-errors
      - name: Pack
        run: |
          mkdir -p out
          (cd extension/dist/chrome && zip -qr ../../../out/haul-extension-chrome.zip .)
          (cd extension/dist/firefox && zip -qr ../../../out/haul-extension-firefox.zip .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: haul-extension
          path: out/*.zip
