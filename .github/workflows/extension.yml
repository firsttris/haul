name: Browser extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['extension/**', '.github/workflows/extension.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @haul/extension typecheck
      - run: pnpm build:extension
      - run: npx --yes web-ext@8 lint --source-dir extension/dist/firefox --warnings-as-errors
      - name: Pack
        run: |
          mkdir -p out
          (cd extension/dist/chrome && zip -qr ../../../out/haul-extension-chrome.zip .)
          (cd extension/dist/firefox && zip -qr ../../../out/haul-extension-firefox.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: haul-extension
          path: out/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
