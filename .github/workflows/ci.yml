name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # The release workflow runs the same checks before it publishes anything.
  workflow_call:
  workflow_dispatch:
  # Weekly on what is on main: new clippy lints of the newest Rust, the image's base images
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: shellcheck scripts/install.sh
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Whether this push touches what the image is built from beyond the code the test job builds
  # and tests: then the docker job builds it. By hand and on the weekly run always; never for a
  # release tag, whose images release.yml builds right after.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "docker=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            push) from="$BEFORE" ;;
            pull_request) from="$BASE" ;;
            *) from="" ;;
          esac
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            docker=true
          elif git diff --name-only "$from" HEAD | grep -qE '^(docker/|\.dockerignore|Cargo\.lock|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|scripts/)'; then
            docker=true
          else
            docker=false
          fi
          echo "docker=$docker" | tee -a "$GITHUB_OUTPUT"

  docker:
    # Build check only, when the image's own files change (see changes); release.yml publishes
    # the images. Next to the test job, its cache shared with the release's amd64 build in the
    # registry (ghcr.io/firsttris/haul-buildcache:linux-amd64, firsttris/workflows
    # actions/docker-build), which every ref can read, unlike the Actions cache.
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: firsttris/workflows/actions/docker-build@ccr-161f105b-9ns022
        with:
          dockerfile: docker/Dockerfile
          tags: haul:ci
