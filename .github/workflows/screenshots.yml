name: Update screenshots

# Takes docs/screenshot.png and docs/social-preview.png from a real haul that downloads from a
# stand-in for the internet (scripts/screenshots/, docs/development.md) and commits the ones
# that changed. Run it after a change to the look.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  screenshots:
    needs: image
    runs-on: ubuntu-latest
    # The browser and its fonts of the @playwright/test version in bun.lock
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # A C compiler for the Rust build, curl for rustup, 7-Zip and unrar for the extraction
      - name: Build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl 7zip unrar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: screenshots
      # The npm package brings the Bun of packageManager without unzip, which the image lacks.
      # node reads the version: the image has no jq. Its own line, so a failure stops the step.
      - name: Install
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "bun@$version"
          bun install --frozen-lockfile
      - name: Build
        run: |
          bun run build
          cargo build --release -p haul
      - name: Take the screenshots
        run: bun run screenshots
      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: |
            docs/screenshot.png
            docs/social-preview.png
          message: Update screenshots
