name: Publish Docker image

# A release tag (v1.2.3) publishes tristanteu/haul:1.2.3, :1.2 and :latest for amd64 and arm64.
# Each platform builds on its own native runner (compiling Rust under QEMU takes too long);
# the merge job joins them into one multi-arch image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: tristanteu/haul

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

      - uses: actions/checkout@v4

      - name: Prepare README for Docker Hub
        run: |
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/main
          BLOB=https://github.com/${{ github.repository }}/blob/main
          sed -E \
            -e "s#\]\((\./|/)?docs/([^)]*\.(png|jpg|svg|gif))#](${RAW}/docs/\2#g" \
            -e "s#src=\"(\./|/)?(docs|ui)/#src=\"${RAW}/\2/#g" \
            -e "s#\]\(LICENSE\)#](${BLOB}/LICENSE)#g" \
            -e "s#\]\((\./|/)?(docs|docker|crates)/#](${BLOB}/\2/#g" \
            README.md > dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ env.IMAGE }}
          short-description: Self-hosted download manager for file hosters, with web UI, plugins and auto-extract
          readme-filepath: ./dockerhub-readme.md
