name: Bump version

# Raises the version in Cargo.toml (and Cargo.lock), tags it vX.Y.Z and starts release.yml on the tag.
# Same scheme as in every project, see https://github.com/firsttris/workflows#bump-version
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  bump:
    uses: firsttris/workflows/.github/workflows/bump-version.yml@e338199e719aa8187493b3a2e2020b340e230af5 # v1
    with:
      bump: ${{ inputs.bump }}
      version-file: Cargo.toml
    permissions:
      contents: write
      actions: write
