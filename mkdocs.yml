# Documentation as a website: https://firsttris.github.io/haul/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Haul
site_description: >-
  Haul, the self-hosted download manager for file hosters: one Rust binary with an
  embedded web UI, hoster plugins in TypeScript, Click'n'Load, auto-extract.
site_url: https://firsttris.github.io/haul/
repo_url: https://github.com/firsttris/haul
repo_name: firsttris/haul
edit_uri: edit/main/docs/
copyright: >-
  License GPL-3.0 · Haul is not affiliated with any of the hosters it supports.

docs_dir: docs
# Pages as installation.html instead of installation/: that way the relative image
# paths of the <img> tags match, which also have to work on GitHub
use_directory_urls: false

nav:
  - Overview: README.md
  - For users:
      - Installation: installation.md
      - Hosters: hosters.md
      - Captchas: captchas.md
      - Extraction: extraction.md
      - Browser extension: browser-extension.md
      - "Click'n'Load": click-n-load.md
  - For developers:
      - Plugins: plugins.md
      - Development: development.md

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/haul
      name: Source code on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/tristanteu/haul
      name: Image on Docker Hub
