services:
  downloader:
    image: ghcr.io/firsttris/haul:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Only on the host's loopback; the desktop reaches it through haul-cnl or an SSH tunnel.
      - "127.0.0.1:9666:9666"
    volumes:
      - ./config:/config
      - /mnt/cache/downloads/tmp:/downloads/tmp
      - /mnt/disk1/downloads:/downloads/done
    environment:
      # Encrypts stored account passwords. Keep it stable and secret: `openssl rand -hex 32`
      - APP_SECRET=change-me
      # Optional: create the web login on first start instead of in the UI.
      # - HAUL_USER=admin
      # - HAUL_PASSWORD=...
