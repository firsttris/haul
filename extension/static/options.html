<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Haul</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1><img src="icons/icon48.png" alt="" /><span data-i18n="optionsTitle"></span></h1>

      <form id="form" class="card">
        <h2 data-i18n="connection"></h2>
        <label for="server" data-i18n="serverLabel"></label>
        <input id="server" type="text" placeholder="http://server.local:8080" autocomplete="off" required />
        <label for="token" data-i18n="tokenLabel"></label>
        <input id="token" type="password" autocomplete="off" required />
        <p class="hint" data-i18n="tokenHint"></p>

        <h2 style="margin-top: 22px" data-i18n="behaviour"></h2>
        <label class="check"><input id="cnl" type="checkbox" /><span><span data-i18n="cnlLabel"></span><br /><span class="hint" data-i18n="cnlHint"></span></span></label>
        <label class="check"><input id="start" type="checkbox" /><span data-i18n="startLabel"></span></label>

        <div class="row">
          <button class="primary" type="submit" data-i18n="save"></button>
          <button id="test" type="button" data-i18n="test"></button>
        </div>
        <div id="status" class="status" role="status"></div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
