<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <h1><img src="icons/icon32.png" alt="" width="22" height="22" />Haul</h1>
        <span id="stats" class="stats"></span>
      </header>
      <textarea id="links" data-i18n-placeholder="pastePlaceholder"></textarea>
      <div class="row">
        <button id="sendLinks" class="primary" data-i18n="sendLinks"></button>
        <button id="sendPage" data-i18n="sendPage"></button>
      </div>
      <div id="status" class="status" role="status"></div>
      <footer>
        <a id="open" href="#" data-i18n="openHaul"></a>
        <a id="settings" href="#" data-i18n="settings"></a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
